name: Windows release

# Builds yara.exe on the self-hosted Windows 11 VM and attaches it to a
# GitHub release. The VM needs Rust (rustup stable, MSVC) preinstalled.
# Register the VM with the label "windows" (see repo workflow docs).
#
# Two ways to run it:
#   - Push a semver tag (e.g. 1.2.0 or v1.2.0): creates/extends that release.
#   - Manual dispatch with release_tag (e.g. 1.1.0): attaches the exe to an
#     existing release without creating a new tag.

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the exe to (created if missing).'
        required: true
        default: ''

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            $msg = "cargo not found on this runner. "
            $msg += "Install Rust (rustup, stable MSVC) on the VM."
            throw $msg
          }
          rustc -V
          cargo -V

      - name: Build
        shell: pwsh
        run: cargo build --release

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:INPUT_RELEASE_TAG) {
            $tag = $env:INPUT_RELEASE_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            throw "No release tag: push a tag, or provide release_tag."
          }
          $exe = "target\release\yara.exe"
          if (-not (Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          gh release view $tag --json url 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            gh release upload $tag $exe --clobber
            Write-Host "Attached $exe to existing release $tag"
          } else {
            gh release create $tag $exe `
              --title "yara $tag (Windows)" `
              --notes "Built on a self-hosted Windows 11 runner."
            Write-Host "Created release $tag with $exe"
          }
