name: Windows release

# Builds yara.exe on the self-hosted Windows 10 VM and attaches it to a
# GitHub release. The VM only needs Rust (rustup stable, MSVC) and Git for
# Windows preinstalled; release uploads use the GitHub REST API via curl
# (built into Windows). Register the VM with the label "windows".
#
# Security model (defense in depth against untrusted PR code):
#   1. Trigger guard: the jobs only run for this exact repo and for tag
#      pushes, manual dispatch, or pull requests (job-level 'if').
#   2. Secret handshake: the build job only proceeds when this repo's
#      WINDOWS_RUNNER_SECRET matches the expected value below. No other
#      repo can inject the secret, so no other repo can drive the runner.
#   3. Manual approval: the build job uses the 'self-hosted' environment.
#      With required reviewers set on it, NOTHING runs on the VM (not even
#      checkout) until a human approves the run in the UI. This is the
#      control that makes fork PRs safe.
#   4. Security scan: a separate job on a GitHub-hosted runner runs
#      'cargo audit' (deps vs RUSTSEC advisories) on the exact code the
#      build would use, before the build job is allowed to start.
#
# Setup: repo Settings > Environments > Add environment, name it
# 'self-hosted', and add yourself as a required reviewer. Also set the
# repo secret WINDOWS_RUNNER_SECRET (value must match EXPECTED_SECRET
# below).
#
# Two ways to release:
#   - Push a semver tag (e.g. 1.2.0 or v1.2.0): creates/extends that
#     release.
#   - Manual dispatch with release_tag (e.g. 1.1.0): attaches the exe to
#     an existing release without creating a new tag.
# Pull requests build but never create or modify releases.

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the exe to (created if missing).'
        required: true
        default: ''

concurrency:
  group: windows-release

jobs:
  scan:
    name: Security scan (GitHub-hosted)
    runs-on: ubuntu-latest
    if: github.repository == 'giacomoguiduzzi/yara'
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build-windows:
    name: Build + release (self-hosted)
    runs-on: [self-hosted, windows]
    environment: self-hosted
    needs: scan
    if: >
      github.repository == 'giacomoguiduzzi/yara' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        github.event_name == 'pull_request')
    permissions:
      contents: write
    steps:
      - name: Verify runner secret
        shell: powershell
        env:
          RUNNER_SECRET: ${{ secrets.WINDOWS_RUNNER_SECRET }}
          EXPECTED_SECRET: '090e00b9093c720dbafadbbbdb31b83f'
        run: |
          if (-not $env:RUNNER_SECRET) {
            throw 'WINDOWS_RUNNER_SECRET is not set on this repo.'
          }
          if ($env:RUNNER_SECRET -ne $env:EXPECTED_SECRET) {
            throw 'Runner secret mismatch - refusing to build.'
          }

      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check Rust toolchain
        shell: powershell
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            $msg = "cargo not found on this runner. "
            $msg += "Install Rust (rustup, stable MSVC) on the VM."
            throw $msg
          }
          rustc -V
          cargo -V

      - name: Build
        shell: powershell
        env:
          # tolerate the old cmake_minimum_required in glsl-to-spirv's
          # vendored glslang (same issue on CMake >= 4)
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release

      - name: Attach to release
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch input (shared across jobs via github.* context;
          # it only reaches the script through this explicit env mapping)
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if ($env:INPUT_RELEASE_TAG) {
            $tag = $env:INPUT_RELEASE_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            throw "No release tag: push a tag, or provide release_tag."
          }
          $api = 'https://api.github.com'
          $repo = $env:GITHUB_REPOSITORY
          $auth = "token $($env:GH_TOKEN)"
          $exe = 'target\release\yara.exe'
          if (-not (Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          # every API call is verified: on failure the step throws with the
          # HTTP status and body instead of printing a fake success
          $code = curl.exe -s -o NUL -w '%{http_code}' `
            -H "Authorization: $auth" "$api/repos/$repo/releases/tags/$tag"
          if ($code -ne '200') {
            $payload = @{
              tag_name = $tag
              name = "yara $tag (Windows)"
              body = 'Built on a self-hosted Windows 10 runner.'
            } | ConvertTo-Json
            # join to one string: multi-line output is an array in
            # PowerShell, and -notmatch on an array FILTERS it, so the
            # JSON body line alone would make the if-branch fire.
            $created = (curl.exe -s -S -w '\nHTTP:%{http_code}' `
              -X POST -H "Authorization: $auth" `
              -H 'Content-Type: application/json' --data $payload `
              "$api/repos/$repo/releases") -join "`n"
            if ($created -notmatch 'HTTP:201') {
              throw "Release creation failed:`n$created"
            }
            Write-Host "Created release $tag"
          }
          $rel = (curl.exe -s -S -H "Authorization: $auth" `
            "$api/repos/$repo/releases/tags/$tag") | ConvertFrom-Json
          foreach ($asset in $rel.assets) {
            if ($asset.name -eq 'yara.exe') {
              curl.exe -s -X DELETE -H "Authorization: $auth" `
                "$api/repos/$repo/releases/assets/$($asset.id)" | Out-Null
            }
          }
          # asset uploads live on uploads.github.com; the legacy
          # api.github.com .../releases/{id}/assets route now 404s.
          # The release object's upload_url points at the live route.
          $uploadBase = ($rel.upload_url -replace '\{.*$','')
          # Build the query via concatenation: in double-quoted strings
          # PowerShell reads $uploadBase?name as ONE variable name
          # (the ? is absorbed), yielding an empty host for curl.
          $uploadUrl = $uploadBase + '?name=yara.exe' + '&label=Windows'
          $upload = (curl.exe -s -S -w '\nHTTP:%{http_code}' `
            -X POST -H "Authorization: $auth" `
            -H 'Content-Type: application/octet-stream' `
            --data-binary "@$exe" `
            $uploadUrl) -join "`n"
          if ($upload -notmatch 'HTTP:201') {
            throw "Asset upload failed:`n$upload"
          }
          $check = (curl.exe -s -S -H "Authorization: $auth" `
            "$api/repos/$repo/releases/tags/$tag") | ConvertFrom-Json
          if (-not ($check.assets | Where-Object {
              $_.name -eq 'yara.exe'
          })) {
            throw 'yara.exe not found on the release after upload'
          }
          Write-Host "Attached yara.exe to release $tag"
