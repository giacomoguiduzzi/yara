name: Windows release

# Builds yara.exe on the self-hosted Windows 11 VM and attaches it to a
# GitHub release. The VM only needs Rust (rustup stable, MSVC) preinstalled;
# release uploads use the GitHub REST API via curl (built into Windows).
# Register the VM with the label "windows".
#
# Two ways to run it:
#   - Push a semver tag (e.g. 1.2.0 or v1.2.0): creates/extends that release.
#   - Manual dispatch with release_tag (e.g. 1.1.0): attaches the exe to an
#     existing release without creating a new tag.

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the exe to (created if missing).'
        required: true
        default: ''

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            $msg = "cargo not found on this runner. "
            $msg += "Install Rust (rustup, stable MSVC) on the VM."
            throw $msg
          }
          rustc -V
          cargo -V

      - name: Build
        shell: pwsh
        run: cargo build --release

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:INPUT_RELEASE_TAG) {
            $tag = $env:INPUT_RELEASE_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            throw "No release tag: push a tag, or provide release_tag."
          }
          $api = 'https://api.github.com'
          $repo = $env:GITHUB_REPOSITORY
          $auth = "token $($env:GH_TOKEN)"
          $exe = 'target\release\yara.exe'
          if (-not (Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          $code = curl.exe -s -o NUL -w '%{http_code}' `
            -H "Authorization: $auth" "$api/repos/$repo/releases/tags/$tag"
          if ($code -ne '200') {
            $payload = @{
              tag_name = $tag
              name = "yara $tag (Windows)"
              body = 'Built on a self-hosted Windows 11 runner.'
            } | ConvertTo-Json
            curl.exe -s -X POST -H "Authorization: $auth" `
              -H 'Content-Type: application/json' --data $payload `
              "$api/repos/$repo/releases" | Out-Null
            Write-Host "Created release $tag"
          }
          $rel = (curl.exe -s -H "Authorization: $auth" `
            "$api/repos/$repo/releases/tags/$tag") | ConvertFrom-Json
          foreach ($asset in $rel.assets) {
            if ($asset.name -eq 'yara.exe') {
              curl.exe -s -X DELETE -H "Authorization: $auth" `
                "$api/repos/$repo/releases/assets/$($asset.id)" | Out-Null
            }
          }
          curl.exe -s -X POST -H "Authorization: $auth" `
            -H 'Content-Type: application/octet-stream' `
            --data-binary "@$exe" `
            "$($rel.url)/assets?name=yara.exe&label=Windows" | Out-Null
          Write-Host "Attached yara.exe to release $tag"
